<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>obstance-dashboard</title>
    <script
      src="https://kit.fontawesome.com/09df92a4fc.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="wrapper-dashboard">
      <a href="mytask.html"></a>
      <a href="calender.html"></a>
      <a href="analutics.html"></a>
      <a href="settings.html"></a>
    </section>
    <section class="header">
      <nav>
        <div class="logo">
          <h3>Dashboard</h3>
        </div>

        <div class="search">
            <button>
                <i
                class="fa-solid fa-magnifying-glass fa-lg" 
                style="color: rgb(15, 1, 207)"
              ></i>
            </button>
            <input type="search" name="srch" placeholder="Search" />
        </div>
        <!-- <i class="search"></i> -->

        <div class="features">

          <i class="fa-regular fa-moon fa-lg" style="color: rgb(42, 27, 255)"></i>
          <i class="fa-regular fa-bell fa-lg" style="color: rgb(199, 9, 9)"></i>
          <div class="profile">
            <img src="profile.jpg" class="profile-img" alt="" />
            <p class="name">karan shah</p>
          </div>
        </div>
      </nav>
    </section>
    <section class="main">
      <div class="todo-card"></div>
      <div class="progress-card"></div>
      <div class="task-done-card"></div>
    </section>
  </body>
</html>
